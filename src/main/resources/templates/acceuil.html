<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Employee Web Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container my-5">

<h2 class="mb-4">Liste des employés</h2>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Si la liste est vide -->
    <tr th:if="${employees.empty}">
        <td colspan="3" class="text-center">Aucun employé en base de données</td>
    </tr>

    <!-- Parcours des employés -->
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.firstName}">Prénom</td>
        <td th:text="${employee.lastName}">Nom</td>
        <td>
            <form th:action="@{'/deleteEmployee/' + ${employee.id}}" method="post" class="d-inline"
                  onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cet employé ?');">
                <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
            </form>

            <form th:action="@{'/editEmployee/' + ${employee.id}}" method="get" class="d-inline">
                <button type="submit" class="btn btn-primary btn-sm">Modifier</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- Lien vers le formulaire d’ajout -->
<a th:href="@{/home}" class="btn btn-success mt-3">Ajouter un employé</a>

</body>
</html>
